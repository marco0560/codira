[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codira-documentation-audit-numpy"
version = "2.0.0"
description = "First-party NumPy documentation audit plugin for codira"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "codira>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "black",
    "mypy",
    "pytest",
    "ruff",
]

[project.entry-points."codira.documentation_audits"]
numpy = "codira_documentation_audit_numpy:build_audit_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codira_documentation_audit_numpy = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codira-bundle-official"
version = "1.65.0"
description = "Curated first-party plugin bundle for codira"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "codira[semantic]==1.55.0",
    "einops>=0.8,<1.0",
    "codira-analyzer-python==1.55.0",
    "codira-analyzer-json==1.56.0",
    "codira-analyzer-c==1.55.0",
    "codira-analyzer-cpp==1.55.0",
    "codira-analyzer-rust==1.56.0",
    "codira-analyzer-javascript==1.65.0",
    "codira-analyzer-bash==1.55.0",
    "codira-analyzer-markdown==1.55.0",
    "codira-analyzer-text==1.55.0",
    "codira-documentation-audit-numpy==1.55.0",
    "codira-documentation-audit-google==1.55.0",
    "codira-documentation-audit-doxygen==1.55.0",
    "codira-documentation-audit-rustdoc==1.55.0",
    "codira-documentation-audit-jsdoc==1.65.0",
    "codira-backend-sqlite==1.57.0",
    "codira-backend-duckdb==1.57.0",
    "codira-embedding-sentence-transformers==1.55.0",
    "codira-embedding-onnx==1.55.0",
    "codira-vector-store-sqlite==1.55.0",
    "codira-vector-store-duckdb==1.55.0",
    "codira-installer==1.55.0",
]

[project.optional-dependencies]
test = [
    "black",
    "mypy",
    "pytest",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

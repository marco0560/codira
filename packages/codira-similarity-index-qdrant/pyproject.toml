[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codira-similarity-index-qdrant"
version = "2.0.0"
description = "First-party authenticated Qdrant similarity-index plugin for codira"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "codira>=2.0.0,<3.0.0",
    "qdrant-client==1.19.0",
]

[project.optional-dependencies]
test = ["mypy", "pytest", "ruff"]

[project.entry-points."codira.similarity_indexes"]
qdrant = "codira_similarity_index_qdrant:build_similarity_index"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codira_similarity_index_qdrant = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

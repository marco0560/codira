[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codira-installer"
version = "2.0.0"
description = "First-party interactive installer for Codira"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["textual>=6.6,<7"]

[project.optional-dependencies]
test = ["jsonschema", "mypy", "pytest", "ruff"]

[project.scripts]
codira-installer = "codira_installer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codira_installer = ["catalog.json", "plan.schema.json", "py.typed"]

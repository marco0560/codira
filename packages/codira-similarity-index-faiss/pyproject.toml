[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codira-similarity-index-faiss"
version = "1.68.0"
description = "First-party FAISS similarity-index plugin for codira"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "codira>=1.68.0,<2.0.0",
    "faiss-cpu==1.15.0",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["mypy", "pytest", "ruff"]

[project.entry-points."codira.similarity_indexes"]
faiss = "codira_similarity_index_faiss:build_similarity_index"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codira_similarity_index_faiss = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

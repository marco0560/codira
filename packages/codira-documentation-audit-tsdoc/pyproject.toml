[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codira-documentation-audit-tsdoc"
version = "1.66.0"
description = "First-party TSDoc documentation audit plugin for codira"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["codira>=1.5.0,<2.0.0"]

[project.optional-dependencies]
test = ["mypy", "pytest", "ruff"]

[project.entry-points."codira.documentation_audits"]
tsdoc = "codira_documentation_audit_tsdoc:build_audit_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
codira_documentation_audit_tsdoc = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

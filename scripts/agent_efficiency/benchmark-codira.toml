# The image build downloads and smoke-tests these pinned local ONNX artifacts.
[embeddings]
enabled = true
engine = "onnx"
model = "BAAI/bge-small-en-v1.5"
version = "1"
dimension = 384
batch_size = 1

[index.concurrency]
strategy = "off"

[plugins.analyzer-bash]
exclude_paths = [".benchmark"]

[plugins.analyzer-javascript]
exclude_paths = [".benchmark"]

[plugins.analyzer-json]
exclude_paths = [".benchmark"]

[plugins.analyzer-markdown]
exclude_paths = [".benchmark"]

[plugins.analyzer-python]
exclude_paths = [".benchmark"]

[plugins.analyzer-text]
exclude_paths = [".benchmark"]

[plugins.embedding-onnx]
model_path = "/opt/codira/.codira/models/bge-small-en-v1.5/model.onnx"
tokenizer_path = "/opt/codira/.codira/models/bge-small-en-v1.5/tokenizer.json"
intra_op_num_threads = 1
inter_op_num_threads = 1

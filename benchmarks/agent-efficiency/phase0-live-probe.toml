schema_version = "1.0"
purpose = "runner-and-isolation-conformance"
attempts = 1

[identity]
codex_version = "0.153.4"
container_runtime = "podman"
image = "ghcr.io/marco0560/codira-agent-benchmark@sha256:3647440cc3b727288bde32e5d651781f4869064c15c64f553474ca25d0aa00eb"

[provider]
name = "openrouter"
model = "openai/gpt-5.6-terra"
reasoning_effort = "medium"
wire_api = "responses"
credential_environment = "codira-tests-openrouter"
provider_key_daily_limit_usd = 0.25

[limits]
timeout_seconds = 600
max_output_tokens = 12000
observed_total_tokens_ceiling = 80000
max_attempts = 1

[evidence]
require_jsonl = true
require_complete_usage = true
require_mcp_startup = true
require_cancellation_probe = true
require_escape_probes = true
record_resolved_model_and_provider = true

[admission]
purpose = "conformance-only"
exclude_from_paired_savings_analysis = true
reject_if_observed_total_tokens_exceed_ceiling = true
reject_if_provider_key_limit_is_not_configured = true
